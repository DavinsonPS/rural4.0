<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 16px Arial, sans-serif; fill: #425466; }
      .label { font: 700 15px Arial, sans-serif; fill: #17212b; }
      .small { font: 13px Arial, sans-serif; fill: #425466; }
      .tiny { font: 11px Arial, sans-serif; fill: #425466; }
      .pin { font: 700 12px Arial, sans-serif; fill: white; }
      .box { fill: white; stroke: #b7c4cf; stroke-width: 2; rx: 8; }
      .wire-red { fill: none; stroke: #e53935; stroke-width: 4; stroke-linecap: round; }
      .wire-black { fill: none; stroke: #20252b; stroke-width: 4; stroke-linecap: round; }
      .wire-green { fill: none; stroke: #16a05d; stroke-width: 4; stroke-linecap: round; }
      .wire-blue { fill: none; stroke: #2674d9; stroke-width: 4; stroke-linecap: round; }
      .wire-yellow { fill: none; stroke: #d69a00; stroke-width: 4; stroke-linecap: round; }
      .wire-purple { fill: none; stroke: #8b4bb3; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#f4f7f9"/>
  <text x="50" y="55" class="title">Guia visual: ESP32 + MB102</text>
  <text x="50" y="83" class="subtitle">Vista superior. Sigue primero la alimentacion y despues conecta cada señal por color.</text>

  <!-- Breadboard -->
  <rect x="275" y="145" width="850" height="700" rx="16" fill="#ffffff" stroke="#8b9aa8" stroke-width="3"/>
  <rect x="300" y="175" width="800" height="30" rx="5" fill="#e53935"/>
  <rect x="300" y="785" width="800" height="30" rx="5" fill="#20252b"/>
  <text x="315" y="196" class="pin">+  RIEL POSITIVO: 3.3 V</text>
  <text x="315" y="806" class="pin">-  RIEL NEGATIVO: GND</text>

  <!-- column labels -->
  <g class="label" text-anchor="middle">
    <text x="420" y="235">A</text><text x="465" y="235">B</text><text x="510" y="235">C</text><text x="555" y="235">D</text><text x="600" y="235">E</text>
    <text x="800" y="235">F</text><text x="845" y="235">G</text><text x="890" y="235">H</text><text x="935" y="235">I</text><text x="980" y="235">J</text>
  </g>
  <text x="676" y="238" class="small" text-anchor="middle">ranura central</text>

  <!-- numbers and holes -->
  <g fill="#d6dde3" stroke="#aebbc5" stroke-width="1">
    <g id="holes-left">
      <circle cx="420" cy="260" r="5"/><circle cx="465" cy="260" r="5"/><circle cx="510" cy="260" r="5"/><circle cx="555" cy="260" r="5"/><circle cx="600" cy="260" r="5"/>
      <circle cx="420" cy="300" r="5"/><circle cx="465" cy="300" r="5"/><circle cx="510" cy="300" r="5"/><circle cx="555" cy="300" r="5"/><circle cx="600" cy="300" r="5"/>
      <circle cx="420" cy="340" r="5"/><circle cx="465" cy="340" r="5"/><circle cx="510" cy="340" r="5"/><circle cx="555" cy="340" r="5"/><circle cx="600" cy="340" r="5"/>
      <circle cx="420" cy="380" r="5"/><circle cx="465" cy="380" r="5"/><circle cx="510" cy="380" r="5"/><circle cx="555" cy="380" r="5"/><circle cx="600" cy="380" r="5"/>
      <circle cx="420" cy="420" r="5"/><circle cx="465" cy="420" r="5"/><circle cx="510" cy="420" r="5"/><circle cx="555" cy="420" r="5"/><circle cx="600" cy="420" r="5"/>
      <circle cx="420" cy="460" r="5"/><circle cx="465" cy="460" r="5"/><circle cx="510" cy="460" r="5"/><circle cx="555" cy="460" r="5"/><circle cx="600" cy="460" r="5"/>
      <circle cx="420" cy="500" r="5"/><circle cx="465" cy="500" r="5"/><circle cx="510" cy="500" r="5"/><circle cx="555" cy="500" r="5"/><circle cx="600" cy="500" r="5"/>
      <circle cx="420" cy="540" r="5"/><circle cx="465" cy="540" r="5"/><circle cx="510" cy="540" r="5"/><circle cx="555" cy="540" r="5"/><circle cx="600" cy="540" r="5"/>
      <circle cx="420" cy="580" r="5"/><circle cx="465" cy="580" r="5"/><circle cx="510" cy="580" r="5"/><circle cx="555" cy="580" r="5"/><circle cx="600" cy="580" r="5"/>
      <circle cx="420" cy="620" r="5"/><circle cx="465" cy="620" r="5"/><circle cx="510" cy="620" r="5"/><circle cx="555" cy="620" r="5"/><circle cx="600" cy="620" r="5"/>
      <circle cx="420" cy="660" r="5"/><circle cx="465" cy="660" r="5"/><circle cx="510" cy="660" r="5"/><circle cx="555" cy="660" r="5"/><circle cx="600" cy="660" r="5"/>
      <circle cx="420" cy="700" r="5"/><circle cx="465" cy="700" r="5"/><circle cx="510" cy="700" r="5"/><circle cx="555" cy="700" r="5"/><circle cx="600" cy="700" r="5"/>
      <circle cx="420" cy="740" r="5"/><circle cx="465" cy="740" r="5"/><circle cx="510" cy="740" r="5"/><circle cx="555" cy="740" r="5"/><circle cx="600" cy="740" r="5"/>
    </g>
    <use href="#holes-left" transform="translate(380,0)"/>
  </g>
  <g class="tiny" text-anchor="end">
    <text x="375" y="264">1</text><text x="375" y="304">2</text><text x="375" y="344">3</text><text x="375" y="384">4</text><text x="375" y="424">5</text><text x="375" y="464">6</text><text x="375" y="504">7</text><text x="375" y="544">8</text><text x="375" y="584">9</text><text x="375" y="624">10</text><text x="375" y="664">11</text><text x="375" y="704">12</text><text x="375" y="744">13</text>
  </g>
  <g class="tiny"><text x="660" y="264">1</text><text x="660" y="304">2</text><text x="660" y="344">3</text><text x="660" y="384">4</text><text x="660" y="424">5</text><text x="660" y="464">6</text><text x="660" y="504">7</text><text x="660" y="544">8</text><text x="660" y="584">9</text><text x="660" y="624">10</text><text x="660" y="664">11</text><text x="660" y="704">12</text><text x="660" y="744">13</text></g>

  <!-- ESP32 -->
  <rect x="622" y="330" width="145" height="350" rx="9" fill="#263238" stroke="#111820" stroke-width="3"/>
  <rect x="648" y="348" width="93" height="45" rx="3" fill="#455a64"/>
  <text x="694" y="377" class="pin" text-anchor="middle">ESP32</text>
  <text x="694" y="410" class="tiny" fill="white" text-anchor="middle">USB hacia arriba</text>
  <g class="tiny" fill="white">
    <text x="630" y="445">15</text><text x="630" y="485">21</text><text x="630" y="525">22</text><text x="630" y="565">34</text><text x="630" y="605">35</text><text x="630" y="645">13</text>
    <text x="748" y="445">3V3</text><text x="748" y="485">GND</text><text x="748" y="525">18</text><text x="748" y="565">19</text><text x="748" y="605">23</text><text x="748" y="645">5</text>
  </g>

  <!-- callout boxes -->
  <rect x="35" y="145" width="210" height="178" class="box"/>
  <text x="55" y="175" class="label">Regla de la placa</text>
  <text x="55" y="203" class="small">Fila 1: A-B-C-D-E</text>
  <text x="55" y="225" class="small">estan conectadas entre si.</text>
  <text x="55" y="253" class="small">F-G-H-I-J tambien,</text>
  <text x="55" y="275" class="small">pero separadas por la ranura.</text>
  <text x="55" y="305" class="label">No es toda la fila.</text>

  <rect x="35" y="355" width="210" height="220" class="box"/>
  <text x="55" y="385" class="label">Orden de montaje</text>
  <text x="55" y="418" class="small">1. Une rojo con 3.3 V.</text>
  <text x="55" y="448" class="small">2. Une azul con GND.</text>
  <text x="55" y="478" class="small">3. Coloca el ESP32.</text>
  <text x="55" y="508" class="small">4. Conecta VCC y GND.</text>
  <text x="55" y="538" class="small">5. Conecta las señales.</text>

  <rect x="1155" y="145" width="210" height="220" class="box"/>
  <text x="1175" y="175" class="label">Sensores principales</text>
  <text x="1175" y="208" class="small">DHT22 → GPIO 15</text>
  <text x="1175" y="238" class="small">Suelo AO → GPIO 34</text>
  <text x="1175" y="268" class="small">Luz AO → GPIO 35</text>
  <text x="1175" y="298" class="small">BH1750 SDA → 21</text>
  <text x="1175" y="328" class="small">BH1750 SCL → 22</text>

  <rect x="1155" y="400" width="210" height="250" class="box"/>
  <text x="1175" y="430" class="label">MicroSD SPI</text>
  <text x="1175" y="463" class="small">CS → GPIO 5</text>
  <text x="1175" y="493" class="small">SCK → GPIO 18</text>
  <text x="1175" y="523" class="small">DO → GPIO 19</text>
  <text x="1175" y="553" class="small">DI → GPIO 23</text>
  <text x="1175" y="603" class="small">Usa modulo de 3.3 V.</text>

  <!-- colored connection guide -->
  <path d="M 767 445 C 830 445, 900 430, 1015 410" class="wire-green"/>
  <path d="M 767 485 C 850 485, 900 490, 1015 490" class="wire-black"/>
  <path d="M 767 525 C 850 525, 900 540, 1015 540" class="wire-yellow"/>
  <path d="M 767 565 C 850 565, 900 590, 1015 590" class="wire-green"/>
  <path d="M 767 605 C 850 605, 900 640, 1015 640" class="wire-blue"/>
  <path d="M 622 445 C 560 445, 520 420, 350 420" class="wire-green"/>
  <path d="M 622 565 C 550 565, 500 600, 350 600" class="wire-green"/>
  <path d="M 622 605 C 550 605, 500 670, 350 670" class="wire-green"/>

  <!-- legend -->
  <rect x="300" y="865" width="800" height="90" rx="8" fill="#fff8e1" stroke="#e0b64b" stroke-width="2"/>
  <text x="325" y="892" class="label">Importante</text>
  <text x="325" y="920" class="small">La matriz NeoPixel debe llevar una fuente externa de 5 V. Une su GND con el GND del ESP32.</text>
  <text x="325" y="943" class="small">No conectes un RTC DS1307 con SDA/SCL a 5 V directamente al ESP32.</text>
</svg>