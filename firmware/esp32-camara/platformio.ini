; Firmware de la ESP32-CAMERA de Rural 4.0 (AI-Thinker ESP32-CAM).
; Base: la configuración de PlatformIO que ya funciona en la placa.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; huge_app.csv no tiene partición OTA: con esta tabla la cámara no se puede actualizar por
; OTA (ENABLE_OTA queda en 0 en config.h). Para OTA habría que usar, p. ej., min_spiffs.csv.
board_build.partitions = huge_app.csv
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^6.21.5
